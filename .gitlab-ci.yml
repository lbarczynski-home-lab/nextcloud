include:
  - component: $CI_SERVER_FQDN/home-lab/automations/docker-compose-service-deployment@v2.0.6
    inputs:
      vm-hostname: cloud.vm.xbhl.intranet
      vm-ssh-username: $SSH_USER
      vm-ssh-private-key: $SSH_PRIVATE_KEY
      service-name: nextcloud
      container-name: nextcloud
      container-location: /opt/containers/nextcloud
      source-files-path: "src/nextcloud"
      additional-files-path: ".nextcloud_generated_sources"
      cloudflare-dns-entry-name: nextcloud.xbhl.online
      cloudflare-dns-strategy: tunnel
      cloudflare-tunnel-uuid: $NEXTCLOUD_CLOUDFLARE_TUNNEL_UUID
      cloudflare-zone-id: $CLOUDFLARE_ZONE_ID
      cloudflare-dns-api-token: $CLOUDFLARE_DNS_API_TOKEN
      container-healthcheck-delay: 360
      delete-existing-container-files: true

  - component: $CI_SERVER_FQDN/home-lab/automations/docker-compose-service-deployment@v2.0.6
    inputs:
      vm-hostname: cloud.vm.xbhl.intranet
      vm-ssh-username: $SSH_USER
      vm-ssh-private-key: $SSH_PRIVATE_KEY
      service-name: collabora
      container-name: collabora
      container-location: /opt/containers/collabora
      source-files-path: "src/collabora"
      additional-files-path: ".collabora_generated_sources"
      cloudflare-dns-entry-name: office.xbhl.online
      cloudflare-dns-strategy: tunnel
      cloudflare-tunnel-uuid: $OFFICE_CLOUDFLARE_TUNNEL_UUID
      cloudflare-zone-id: $CLOUDFLARE_ZONE_ID
      cloudflare-dns-api-token: $CLOUDFLARE_DNS_API_TOKEN
      delete-existing-container-files: true

  - component: $CI_SERVER_FQDN/home-lab/automations/docker-compose-service-deployment@v2.0.6
    inputs:
      vm-hostname: nas.srv.xbhl.intranet
      vm-ssh-username: $SSH_USER
      vm-ssh-private-key: $SSH_PRIVATE_KEY
      service-name: go-vod
      container-name: nextcloud_go_vod
      container-location: /share/Container/services/nextcloud-go-vod
      source-files-path: "src/go-vod"
      cloudflare-dns-entry-name: nextcloud-go-vod.intranet.xbhl.online
      cloudflare-zone-id: $CLOUDFLARE_ZONE_ID
      cloudflare-dns-api-token: $CLOUDFLARE_DNS_API_TOKEN
      delete-existing-container-files: true

test:go-vod:docker-compose:
  script:
    - echo "🔵 Skipping docker-compose test due to lack of NVIDIA GPU in runner environment"

test:nextcloud:docker-compose:
  before_script:
    - docker run --rm -v /tmp:/mnt alpine rm -rf /mnt/nextcloud-test-data
    - docker run --rm -v /tmp/nextcloud-test-data:/tmp/nextcloud-test-data alpine true
  variables:
    NEXTCLOUD_STORAGE_DRIVER_TYPE: "none"
    NEXTCLOUD_STORAGE_DRIVER_OPTS: "bind"
    NEXTCLOUD_STORAGE_DEVICE: "/tmp/nextcloud-test-data"

setup:generate-build-artifacts:
  script:
    - 'apk add --no-cache bash jq'
    # Nextcloud generated sources
    - 'mkdir -p .nextcloud_generated_sources/envs .nextcloud_generated_sources/cloudflared-config'
    - 'cp -r src/nextcloud/envs/. .nextcloud_generated_sources/envs/'
    - 'cp -r src/nextcloud/cloudflared-config/. .nextcloud_generated_sources/cloudflared-config/'
    - './scripts/generate-cloudflare-tunnel-credentials.sh -t "${NEXTCLOUD_CLOUDFLARE_TUNNEL_TOKEN:?NEXTCLOUD_CLOUDFLARE_TUNNEL_TOKEN is not set}" -o .nextcloud_generated_sources/cloudflared-config/credentials.json'
    - 'sed -i "s|^tunnel:.*|tunnel: ${NEXTCLOUD_CLOUDFLARE_TUNNEL_UUID:?NEXTCLOUD_CLOUDFLARE_TUNNEL_UUID is not set}|" .nextcloud_generated_sources/cloudflared-config/config.yml'
    - 'sed -i "s|^NEXTCLOUD_MAIN_USER=.*|NEXTCLOUD_MAIN_USER=${NEXTCLOUD_MAIN_USER:-lbarczynski}|" .nextcloud_generated_sources/envs/nextcloud.env'
    - 'sed -i "s|^NEXTCLOUD_ADMIN_PASSWORD=.*|NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASSWORD:?NEXTCLOUD_ADMIN_PASSWORD is not set}|" .nextcloud_generated_sources/envs/nextcloud.env'
    - 'sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=${NEXTCLOUD_DB_PASSWORD:?NEXTCLOUD_DB_PASSWORD is not set}|" .nextcloud_generated_sources/envs/db.env'
    - 'sed -i "s|^REDIS_HOST_PASSWORD=.*|REDIS_HOST_PASSWORD=${NEXTCLOUD_REDIS_PASSWORD:?NEXTCLOUD_REDIS_PASSWORD is not set}|" .nextcloud_generated_sources/envs/redis.env'
    - 'sed -i "s|^OIDC_CLIENT_SECRET=.*|OIDC_CLIENT_SECRET=${NEXTCLOUD_OAUTH_CLIENT_SECRET:?NEXTCLOUD_OAUTH_CLIENT_SECRET is not set}|" .nextcloud_generated_sources/envs/oidc.env'
    - 'sed -i "s|^AI_API_KEY=.*|AI_API_KEY=${OPEN_WEBUI_API_KEY:?OPEN_WEBUI_API_KEY is not set}|" .nextcloud_generated_sources/envs/ai.env'
    - 'sed -i "s|^SMTP_HOST=.*|SMTP_HOST=${SMTP_HOST:?SMTP_HOST is not set}|" .nextcloud_generated_sources/envs/smtp.env'
    - 'sed -i "s|^SMTP_PORT=.*|SMTP_PORT=${SMTP_PORT:?SMTP_PORT is not set}|" .nextcloud_generated_sources/envs/smtp.env'
    - 'sed -i "s|^SMTP_USERNAME=.*|SMTP_USERNAME=${SMTP_USERNAME:?SMTP_USERNAME is not set}|" .nextcloud_generated_sources/envs/smtp.env'
    - 'sed -i "s|^SMTP_PASSWORD=.*|SMTP_PASSWORD=${SMTP_PASSWORD:?SMTP_PASSWORD is not set}|" .nextcloud_generated_sources/envs/smtp.env'
    - 'sed -i "s|^SMTP_FROM=.*|SMTP_FROM=${SMTP_FROM:?SMTP_FROM is not set}|" .nextcloud_generated_sources/envs/smtp.env'
    - 'sed -i "s|^COTURN_SECRET=.*|COTURN_SECRET=${NEXTCLOUD_COTURN_SECRET:?NEXTCLOUD_COTURN_SECRET is not set}|" .nextcloud_generated_sources/envs/talk.env'
    # Collabora generated sources
    - 'mkdir -p .collabora_generated_sources/envs .collabora_generated_sources/cloudflared-config'
    - 'cp -r src/collabora/envs/. .collabora_generated_sources/envs/'
    - 'cp -r src/collabora/cloudflared-config/. .collabora_generated_sources/cloudflared-config/'
    - './scripts/generate-cloudflare-tunnel-credentials.sh -t "${OFFICE_CLOUDFLARE_TUNNEL_TOKEN:?OFFICE_CLOUDFLARE_TUNNEL_TOKEN is not set}" -o .collabora_generated_sources/cloudflared-config/credentials.json'
    - 'sed -i "s|^tunnel:.*|tunnel: ${OFFICE_CLOUDFLARE_TUNNEL_UUID:?OFFICE_CLOUDFLARE_TUNNEL_UUID is not set}|" .collabora_generated_sources/cloudflared-config/config.yml'
  artifacts:
    paths:
      - .nextcloud_generated_sources/
      - .collabora_generated_sources/
      - $BUILD_ARTIFACTS_DIR/

deploy:nextcloud:update-coturn-dns:
  stage: deploy
  image: alpine:3.24.1
  needs:
    - "deploy:nextcloud:start-service"
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
  variables:
    DNS_RECORD_TYPE: "A"
    DNS_TTL: 120
    DNS_PROXIED: "false"
    CLOUDFLARE_DNS_ENTRY_NAME: "talk.nextcloud.xbhl.online"
  before_script:
    - apk add --no-cache curl jq
  script:
    - 'export DNS_CONTENT=$(curl -s https://api.ipify.org || curl -s https://ifconfig.me || curl -s https://icanhazip.com)'
    - 'echo "Resolved public router IP for Coturn: $DNS_CONTENT"'
    - !reference [.cloudflare-update-script, script]

deploy:go-vod:start-service:
  needs:
    - "deploy:go-vod:deploy-files"
    - "deploy:nextcloud:start-service"
