include:
  - component: $CI_SERVER_FQDN/home-lab/automations/docker-compose-service-deployment@v2.1.4
    inputs:
      vm-hostname: cloud.vm.xbhl.intranet
      vm-ssh-username: $SSH_USER
      vm-ssh-private-key: $SSH_PRIVATE_KEY
      service-name: nextcloud
      container-name: nextcloud
      container-location: /opt/containers/nextcloud
      source-files-path: "src"
      cloudflare-dns-entry-name: nextcloud.xbhl.online
      cloudflare-dns-strategy: tunnel
      cloudflare-tunnel-uuid: $NEXTCLOUD_CLOUDFLARE_TUNNEL_UUID
      cloudflare-zone-id: $CLOUDFLARE_ZONE_ID
      cloudflare-dns-api-token: $CLOUDFLARE_DNS_API_TOKEN
      container-healthcheck-delay: 360
      delete-existing-container-files: true

.preconfigure-run-script:
  script:
    - !reference [.base:core:logger, script]
    - !reference [.base:core:exec, script]
    - !reference [.base:docker:register-network-helpers, script]
    - ensure_docker_network "wopi_internal_network" "bridge"

test:nextcloud:docker-compose:
  before_script:
    - 'docker run --rm -v /tmp:/mnt alpine rm -rf /mnt/nextcloud-test-data'
    - 'docker run --rm -v /tmp/nextcloud-test-data:/tmp/nextcloud-test-data alpine true'
    - 'sed -i "s|type: nfs|type: none|; s|o: addr=.*|o: bind|; s|device: :/RemoteStorage/NextCloud|device: /tmp/nextcloud-test-data|" src/docker-compose.yml'

test:nextcloud:shell-syntax:
  stage: test
  extends: .base:image:alpine
  script:
    - !reference [.base:core:logger, script]
    - 'apk add --no-cache bash shellcheck'
    - |
      exit_status=0
      for file in $(find scripts src/scripts -name '*.sh' | sort); do
        log_info "Checking ${file}..."
        if [ "$(head -n 1 "${file}")" = "#!/bin/sh" ]; then
          sh -n "${file}" || exit_status=1
        else
          bash -n "${file}" || exit_status=1
        fi
        shellcheck -x -S warning "${file}" || exit_status=1
      done
      if [ "${exit_status}" -ne 0 ]; then
        log_error "Shell syntax or ShellCheck validation failed!"
        exit "${exit_status}"
      fi
      log_success "All shell scripts passed syntax and ShellCheck validation!"

setup:generate-build-artifacts:
  script:
    - !reference [.base:core:logger, script]
    - 'apk add --no-cache bash jq'
    - 'log_info "Generating Nextcloud build artifacts in ${BUILD_ARTIFACTS_DIR}..."'
    - 'cp -r src/envs "$BUILD_ARTIFACTS_DIR/"'
    - 'cp -r src/cloudflared-config "$BUILD_ARTIFACTS_DIR/"'
    - './scripts/generate-cloudflare-tunnel-credentials.sh -t "${NEXTCLOUD_CLOUDFLARE_TUNNEL_TOKEN:?ERROR: NEXTCLOUD_CLOUDFLARE_TUNNEL_TOKEN is required and cannot be empty}" -o "$BUILD_ARTIFACTS_DIR/cloudflared-config/credentials.json"'
    - 'sed -i "s|^tunnel:.*|tunnel: ${NEXTCLOUD_CLOUDFLARE_TUNNEL_UUID:?ERROR: NEXTCLOUD_CLOUDFLARE_TUNNEL_UUID is required and cannot be empty}|" "$BUILD_ARTIFACTS_DIR/cloudflared-config/config.yml"'
    - './scripts/set-env-value.sh "$BUILD_ARTIFACTS_DIR/envs/nextcloud.env" NEXTCLOUD_ADMIN_PASSWORD "${NEXTCLOUD_ADMIN_PASSWORD:?ERROR: NEXTCLOUD_ADMIN_PASSWORD is required and cannot be empty}"'
    - './scripts/set-env-value.sh "$BUILD_ARTIFACTS_DIR/envs/db.env" POSTGRES_PASSWORD "${NEXTCLOUD_DB_PASSWORD:?ERROR: NEXTCLOUD_DB_PASSWORD is required and cannot be empty}"'
    - './scripts/set-env-value.sh "$BUILD_ARTIFACTS_DIR/envs/redis.env" REDIS_HOST_PASSWORD "${NEXTCLOUD_REDIS_PASSWORD:?ERROR: NEXTCLOUD_REDIS_PASSWORD is required and cannot be empty}"'
    - './scripts/set-env-value.sh "$BUILD_ARTIFACTS_DIR/envs/oidc.env" OIDC_CLIENT_SECRET "${NEXTCLOUD_OAUTH_CLIENT_SECRET:?ERROR: NEXTCLOUD_OAUTH_CLIENT_SECRET is required and cannot be empty}"'
    - './scripts/set-env-value.sh "$BUILD_ARTIFACTS_DIR/envs/ai.env" AI_API_KEY "${AI_API_KEY:?ERROR: AI_API_KEY is required and cannot be empty}"'
    - './scripts/set-env-value.sh "$BUILD_ARTIFACTS_DIR/envs/smtp.env" SMTP_HOST "${SMTP_HOST:?ERROR: SMTP_HOST is required and cannot be empty}"'
    - './scripts/set-env-value.sh "$BUILD_ARTIFACTS_DIR/envs/smtp.env" SMTP_PORT "${SMTP_PORT:?ERROR: SMTP_PORT is required and cannot be empty}"'
    - './scripts/set-env-value.sh "$BUILD_ARTIFACTS_DIR/envs/smtp.env" SMTP_USERNAME "${SMTP_USERNAME:?ERROR: SMTP_USERNAME is required and cannot be empty}"'
    - './scripts/set-env-value.sh "$BUILD_ARTIFACTS_DIR/envs/smtp.env" SMTP_PASSWORD "${SMTP_PASSWORD:?ERROR: SMTP_PASSWORD is required and cannot be empty}"'
    - './scripts/set-env-value.sh "$BUILD_ARTIFACTS_DIR/envs/smtp.env" SMTP_FROM "${SMTP_FROM:?ERROR: SMTP_FROM is required and cannot be empty}"'
    - './scripts/set-env-value.sh "$BUILD_ARTIFACTS_DIR/envs/talk.env" COTURN_SECRET "${NEXTCLOUD_COTURN_SECRET:?ERROR: NEXTCLOUD_COTURN_SECRET is required and cannot be empty}"'
    - './scripts/set-env-value.sh "$BUILD_ARTIFACTS_DIR/envs/api-keys.env" GIPHY_API_KEY "${GIPHY_API_KEY:?ERROR: GIPHY_API_KEY is required and cannot be empty}"'
    - './scripts/set-env-value.sh "$BUILD_ARTIFACTS_DIR/envs/appapi.env" HP_SHARED_KEY "${NEXTCLOUD_APPAPI_HARP_SHARED_KEY:?ERROR: NEXTCLOUD_APPAPI_HARP_SHARED_KEY is required and cannot be empty}"'
    - 'log_success "Generated Nextcloud build artifacts in ${BUILD_ARTIFACTS_DIR}!"'

verify:nextcloud:config-reconciliation:
  stage: verify
  extends: .ssh-job-base:nextcloud
  needs:
    - "deploy:nextcloud:start-service"
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
  script:
    - !reference [.base:core:logger, script]
    - !reference [.base:core:exec, script]
    - 'log_info "Re-running configuration reconciliation to verify the deployment..."'
    - 'run_cmd "docker exec nextcloud /scripts/configure-nextcloud.sh"'
    - 'log_success "Nextcloud configuration reconciliation verified successfully!"'

.coturn-init:
  script:
    - !reference [.base:core:logger, script]
    - |
      DNS_RECORD_CONTENT=$(curl -4 -fsS --max-time 5 https://api.ipify.org || curl -4 -fsS --max-time 5 https://ifconfig.me || curl -4 -fsS --max-time 5 https://icanhazip.com)
      DNS_RECORD_CONTENT=$(printf '%s' "$DNS_RECORD_CONTENT" | tr -d '[:space:]')
      if ! printf '%s\n' "$DNS_RECORD_CONTENT" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'; then
        log_error "Failed to resolve a valid public IPv4 address for Coturn (got: '$DNS_RECORD_CONTENT')"
        exit 1
      fi
      export DNS_RECORD_CONTENT
      log_info "Resolved public router IP for Coturn: $DNS_RECORD_CONTENT"

deploy:nextcloud:update-coturn-dns:
  stage: deploy
  extends: .base:image:alpine
  needs:
    - "deploy:nextcloud:deploy-files"
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
  variables:
    CF_ZONE_ID: "$CLOUDFLARE_ZONE_ID"
    CF_API_TOKEN: "$CLOUDFLARE_DNS_API_TOKEN"
    DNS_RECORD_NAME: "talk.nextcloud.xbhl.online"
    DNS_RECORD_TYPE: "A"
    DNS_RECORD_TTL: 120
    DNS_RECORD_PROXIED: "false"
  script:
    - !reference [.coturn-init, script]
    - !reference [.base:dns:cloudflare:record:find, script]
    - !reference [.base:dns:cloudflare:record:create, script]
    - !reference [.base:dns:cloudflare:record:update, script]

deploy:nextcloud:start-service:
  needs:
    - "setup:generate-build-artifacts"
    - "deploy:nextcloud:deploy-files"
    - "deploy:nextcloud:update-coturn-dns"
