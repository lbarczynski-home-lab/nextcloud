services:
  collabora:
    build: .
    container_name: collabora
    env_file:
      - envs/collabora.env
    environment:
      aliasgroup1: "https://nextcloud.xbhl.online:443"
      extra_params: "--o:ssl.enable=false --o:ssl.termination=true --o:welcome.enable=false --o:net.proto=IPv4"
      server_name: "office.xbhl.online"
      dictionaries: "pl_PL en_US en_GB"
    cap_add:
      - MKNOD
    networks:
      - collabora_internal
    healthcheck:
      test: [ "CMD", "/usr/bin/wget", "-q", "-O", "-", "http://127.0.0.1:9980/hosting/discovery" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.8.2
    container_name: collabora_cloudflared
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared-config:/etc/cloudflared:ro
    networks:
      - collabora_internal
    depends_on:
      collabora:
        condition: service_healthy
    restart: unless-stopped

networks:
  collabora_internal:
    name: collabora_internal_network
