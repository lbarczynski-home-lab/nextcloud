memory_limit = 2048M
upload_max_filesize = 16G
post_max_size = 16G
max_execution_time = 3600
max_input_time = 3600
output_buffering = 0
apc.enable_cli = 1

opcache.enable = 1
opcache.interned_strings_buffer = 64
opcache.max_accelerated_files = 30000
opcache.memory_consumption = 512
opcache.save_comments = 1
# revalidate_freq=1 re-stat()s every cached file on effectively every
# request. App code only changes via `occ app:update`/installs (which run
# automatically here), not live edits, so checking once every 60s is
# still prompt while cutting most of that per-request filesystem overhead.
# Do NOT set opcache.validate_timestamps=0: with automatic app updates,
# that leaves stale bytecode running until the container restarts, and
# is known to break Nextcloud's maintenance-mode page (nextcloud/server#37557).
opcache.revalidate_freq = 60
