; memory_limit, upload_max_filesize, post_max_size, and opcache.memory_consumption
; are configured via PHP_* environment variables in envs/nextcloud.env.
max_execution_time = 3600
max_input_time = 3600
output_buffering = 0
apc.enable_cli = 1

opcache.enable = 1
opcache.interned_strings_buffer = 64
opcache.max_accelerated_files = 30000
opcache.save_comments = 1
; Do not set opcache.validate_timestamps=0: app updates run automatically
; here, and disabling it entirely leaves stale bytecode running until the
; container restarts. Also known to break Nextcloud's maintenance-mode
; page - see nextcloud/server issue 37557.
opcache.revalidate_freq = 60
