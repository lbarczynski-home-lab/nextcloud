memory_limit = 2048M
upload_max_filesize = 16G
post_max_size = 16G
max_execution_time = 3600
max_input_time = 3600
output_buffering = 0
apc.enable_cli = 1

opcache.enable = 1
opcache.interned_strings_buffer = 64
opcache.max_accelerated_files = 10000
opcache.memory_consumption = 512
opcache.save_comments = 1
opcache.revalidate_freq = 1
