services:
  nextcloud:
    build: .
    container_name: nextcloud
    env_file:
      - envs/nextcloud.env
      - envs/db.env
      - envs/redis.env
      - envs/oidc.env
      - envs/ai.env
      - envs/smtp.env
      - envs/talk.env
      - envs/retention.env
    volumes:
      - nextcloud_data:/var/nc-data:nocopy
      - nextcloud_html:/var/www/html
      - scripts:/scripts
    networks:
      - nextcloud_internal
    healthcheck:
      test: [ "CMD-SHELL", "/scripts/healthcheck.sh" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 180s
    depends_on:
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      coturn:
        condition: service_healthy
    restart: unless-stopped

  nextcloud_cron:
    build: .
    container_name: nextcloud_cron
    entrypoint: [ "/cron.sh" ]
    env_file:
      - envs/nextcloud.env
      - envs/db.env
      - envs/redis.env
      - envs/oidc.env
      - envs/ai.env
      - envs/smtp.env
      - envs/retention.env
    volumes:
      - nextcloud_data:/var/nc-data:nocopy
      - nextcloud_html:/var/www/html
    networks:
      - nextcloud_internal
    depends_on:
      nextcloud:
        condition: service_healthy
    restart: unless-stopped

  nextcloud_maintenance_worker:
    build: .
    container_name: nextcloud_maintenance_worker
    entrypoint: [ "/scripts/maintenance-worker.sh" ]
    env_file:
      - envs/nextcloud.env
      - envs/db.env
      - envs/redis.env
      - envs/oidc.env
      - envs/ai.env
      - envs/smtp.env
      - envs/retention.env
    volumes:
      - nextcloud_data:/var/nc-data:nocopy
      - nextcloud_html:/var/www/html
      - scripts:/scripts
    networks:
      - nextcloud_internal
    depends_on:
      nextcloud:
        condition: service_healthy
    restart: unless-stopped

  postgres_db:
    image: postgres:18.6
    container_name: nextcloud_postgres
    shm_size: 256mb
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c maintenance_work_mem=128MB
      -c work_mem=16MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
    env_file:
      - envs/db.env
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - nextcloud_internal
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:8.10.0
    container_name: nextcloud_redis
    env_file:
      - envs/redis.env
    command: /bin/sh -c 'exec redis-server --requirepass "$$REDIS_HOST_PASSWORD"'
    volumes:
      - redis_data:/data
    networks:
      - nextcloud_internal
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$$REDIS_HOST_PASSWORD\" ping | grep PONG || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.5.4_base
    container_name: nextcloud_clamav
    environment:
      - CLAMAV_NO_FRESHCLAM=false
    volumes:
      - clamav_db:/var/lib/clamav
    networks:
      - nextcloud_internal
    healthcheck:
      test: [ "CMD-SHELL", "nc -z 127.0.0.1 3310 || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 300s
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.1
    container_name: nextcloud_elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - nextcloud_internal
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'status' || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    restart: unless-stopped

  tika:
    image: apache/tika:3.3.1.0-full
    container_name: nextcloud_tika
    networks:
      - nextcloud_internal
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4.17.2-alpine
    container_name: nextcloud_coturn
    env_file:
      - envs/talk.env
    command: >
      /bin/sh -c 'exec turnserver -n --log-file=stdout --listening-port=3478 --min-port=49152 --max-port=49172 --realm="$$COTURN_REALM" --use-auth-secret --static-auth-secret="$$COTURN_SECRET" --fingerprint --lt-cred-mech --stale-nonce=600 --no-multicast-peers'
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49152-49172:49152-49172/udp"
    networks:
      - nextcloud_internal
    healthcheck:
      test: [ "CMD-SHELL", "turnutils_stunclient 127.0.0.1 3478 || exit 1" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  notify_push:
    image: nextcloud/notify_push:0.7.0
    container_name: nextcloud_notify_push
    environment:
      - PORT=7867
      - NEXTCLOUD_URL=http://nextcloud
    env_file:
      - envs/db.env
      - envs/redis.env
    volumes:
      - nextcloud_html:/var/www/html:ro
    networks:
      - nextcloud_internal
    depends_on:
      nextcloud:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres_db:
        condition: service_healthy
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.8.2
    container_name: nextcloud_cloudflared
    profiles: [ "production" ]
    command: tunnel run
    environment:
      - NO_AUTOUPDATE=true
    volumes:
      - ./cloudflared-config:/etc/cloudflared
    networks:
      - nextcloud_internal
    depends_on:
      nextcloud:
        condition: service_healthy
    restart: unless-stopped

volumes:
  nextcloud_html:
    driver: local

  postgres_data:
    driver: local

  redis_data:
    driver: local

  clamav_db:
    driver: local

  elasticsearch_data:
    driver: local

  scripts:
    driver: local
    driver_opts:
      type: "none"
      o: "bind"
      device: "./scripts"

  nextcloud_data:
    driver: local
    driver_opts:
      type: "${NEXTCLOUD_STORAGE_DRIVER_TYPE:-nfs}"
      o: "${NEXTCLOUD_STORAGE_DRIVER_OPTS:-addr=nas.srv.xbhl.intranet,rw,soft,timeo=100,nolock}"
      device: "${NEXTCLOUD_STORAGE_DEVICE:-:/share/NFSv=4/RemoteStorage/NextCloud}"

networks:
  nextcloud_internal:
    name: nextcloud_internal_network
