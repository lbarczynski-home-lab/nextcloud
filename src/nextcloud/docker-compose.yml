services:
  nextcloud:
    build: .
    image: nextcloud:35.0.0-apache
    container_name: nextcloud
    mem_limit: 1.5g
    env_file:
      - envs/nextcloud.env
      - envs/db.env
      - envs/redis.env
      - envs/oidc.env
      - envs/ai.env
      - envs/api-keys.env
      - envs/smtp.env
      - envs/talk.env
      - envs/retention.env
    labels:
      - 'wud.watch=true'
      - 'wud.display.name=Nextcloud'
      - 'wud.display.icon=si:nextcloud'
      - 'wud.tag.include=^\d+\.\d+\.\d+-apache$$'
      - "wud.link.template=https://github.com/nextcloud/server/releases/tag/v$${major}.$${minor}.$${patch}"
    volumes:
      - nextcloud_data:/var/nc-data:nocopy
      - nextcloud_html:/var/www/html
      - scripts:/scripts
    networks:
      - nextcloud_internal
    healthcheck:
      test: [ "CMD-SHELL", "/scripts/healthcheck.sh" ]
      interval: 30s
      start_interval: 5s
      timeout: 5s
      retries: 3
      start_period: 270s
    depends_on:
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      tika:
        condition: service_healthy
      coturn:
        condition: service_healthy
      imaginary:
        condition: service_healthy
    restart: unless-stopped

  nextcloud_cron:
    build: .
    container_name: nextcloud_cron
    entrypoint: [ "/cron.sh" ]
    mem_limit: 512m
    env_file:
      - envs/nextcloud.env
      - envs/db.env
      - envs/redis.env
      - envs/oidc.env
      - envs/ai.env
      - envs/smtp.env
      - envs/retention.env
    volumes:
      - nextcloud_data:/var/nc-data:nocopy
      - nextcloud_html:/var/www/html
    networks:
      - nextcloud_internal
    depends_on:
      nextcloud:
        condition: service_healthy
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nextcloud_maintenance_worker:
    build: .
    container_name: nextcloud_maintenance_worker
    entrypoint: [ "/scripts/maintenance-worker.sh" ]
    mem_limit: 768m
    env_file:
      - envs/nextcloud.env
      - envs/db.env
      - envs/redis.env
      - envs/oidc.env
      - envs/ai.env
      - envs/smtp.env
      - envs/retention.env
    volumes:
      - nextcloud_data:/var/nc-data:nocopy
      - nextcloud_html:/var/www/html
      - scripts:/scripts
    networks:
      - nextcloud_internal
    depends_on:
      nextcloud:
        condition: service_healthy
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nextcloud_ai_worker:
    build: .
    container_name: nextcloud_ai_worker
    entrypoint: [ "/scripts/continuous-worker.sh", "3600" ]
    mem_limit: 768m
    env_file:
      - envs/nextcloud.env
      - envs/db.env
      - envs/redis.env
      - envs/oidc.env
      - envs/ai.env
      - envs/smtp.env
      - envs/retention.env
    volumes:
      - nextcloud_data:/var/nc-data:nocopy
      - nextcloud_html:/var/www/html
      - scripts:/scripts
    networks:
      - nextcloud_internal
    depends_on:
      nextcloud:
        condition: service_healthy
      postgres_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres_db:
    image: postgres:18.6
    container_name: nextcloud_postgres
    mem_limit: 1g
    labels:
      - 'wud.watch=true'
      - 'wud.display.name=PostgreSQL'
      - 'wud.display.icon=si:postgresql'
      - 'wud.tag.include=^18\.\d+$$'
      - "wud.link.template=https://www.postgresql.org/docs/release/$${major}.$${minor}/"
    shm_size: 256mb
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c maintenance_work_mem=128MB
      -c work_mem=16MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
    env_file:
      - envs/db.env
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - nextcloud_internal
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} || exit 1" ]
      interval: 30s
      start_interval: 5s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:8.10.1
    container_name: nextcloud_redis
    mem_limit: 256m
    labels:
      - 'wud.watch=true'
      - 'wud.display.name=Redis'
      - 'wud.display.icon=si:redis'
      - 'wud.tag.include=^\d+\.\d+\.\d+$$'
      - "wud.link.template=https://github.com/redis/redis/releases/tag/$${major}.$${minor}.$${patch}"
    env_file:
      - envs/redis.env
    command: /bin/sh -c 'exec redis-server --requirepass "$$REDIS_HOST_PASSWORD" --maxmemory 128mb --maxmemory-policy allkeys-lru'
    volumes:
      - redis_data:/data
    networks:
      - nextcloud_internal
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a \"$$REDIS_HOST_PASSWORD\" ping | grep PONG || exit 1" ]
      interval: 30s
      start_interval: 5s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.5.4_base
    container_name: nextcloud_clamav
    mem_limit: 1.25g
    labels:
      - 'wud.watch=true'
      - 'wud.display.name=ClamAV'
      - 'wud.display.icon=mdi:shield-check'
      - 'wud.tag.include=^\d+\.\d+\.\d+_base$$'
      - "wud.link.template=https://github.com/Cisco-Talos/clamav/releases/tag/clamav-$${major}.$${minor}.$${patch}"
    environment:
      - CLAMAV_NO_FRESHCLAM=false
    volumes:
      - clamav_db:/var/lib/clamav
    networks:
      - nextcloud_internal
    healthcheck:
      test: [ "CMD-SHELL", "nc -z 127.0.0.1 3310 || exit 1" ]
      interval: 30s
      start_interval: 5s
      timeout: 5s
      retries: 3
      start_period: 150s
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    container_name: nextcloud_elasticsearch
    mem_limit: 1.25g
    labels:
      - 'wud.watch=true'
      - 'wud.display.name=Elasticsearch'
      - 'wud.display.icon=si:elasticsearch'
      - 'wud.tag.include=^\d+\.\d+\.\d+$$'
      - "wud.link.template=https://www.elastic.co/guide/en/elasticsearch/reference/current/release-notes-$${major}-$${minor}-$${patch}.html"
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - nextcloud_internal
    healthcheck:
      test: [ "CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'status' || exit 1" ]
      interval: 30s
      start_interval: 5s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  tika:
    image: apache/tika:3.3.1.0-full
    container_name: nextcloud_tika
    mem_limit: 512m
    labels:
      - 'wud.watch=true'
      - 'wud.display.name=Apache Tika'
      - 'wud.display.icon=si:apache'
      - 'wud.tag.include=^\d+\.\d+\.\d+\.\d+-full$$'
      - "wud.link.template=https://github.com/apache/tika/releases"
    networks:
      - nextcloud_internal
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://127.0.0.1:9998/version" ]
      interval: 30s
      start_interval: 5s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  imaginary:
    image: nextcloud/aio-imaginary:20260916_075031
    container_name: nextcloud_imaginary
    command: -concurrency 50 -enable-url-source -http-read-timeout 180 -http-write-timeout 180
    mem_limit: 256m
    cap_add:
      - SYS_NICE
    labels:
      - 'wud.watch=true'
      - 'wud.display.name=Imaginary'
      - 'wud.display.icon=mdi:image-filter-hdr'
      - 'wud.tag.include=^\d{8}_\d{6}$$'
      - "wud.link.template=https://hub.docker.com/layers/nextcloud/aio-imaginary/$${raw}"
    networks:
      - nextcloud_internal
    healthcheck:
      test: [ "CMD-SHELL", "/healthcheck.sh" ]
      interval: 30s
      start_interval: 5s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4.18.0-alpine
    container_name: nextcloud_coturn
    mem_limit: 128m
    labels:
      - 'wud.watch=true'
      - 'wud.display.name=Coturn'
      - 'wud.display.icon=mdi:phone-in-talk'
      - 'wud.tag.include=^\d+\.\d+\.\d+-alpine$$'
      - "wud.link.template=https://github.com/coturn/coturn/releases/tag/$${major}.$${minor}.$${patch}"
    env_file:
      - envs/talk.env
    command: >
      /bin/sh -c 'exec turnserver -n --log-file=stdout --listening-port=3478 --min-port=49152 --max-port=49172 --realm="$$COTURN_REALM" --use-auth-secret --static-auth-secret="$$COTURN_SECRET" --fingerprint --lt-cred-mech --stale-nonce=600 --no-multicast-peers'
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49152-49172:49152-49172/udp"
    networks:
      - nextcloud_internal
    healthcheck:
      test: [ "CMD-SHELL", "turnutils_stunclient 127.0.0.1 3478 || exit 1" ]
      interval: 30s
      start_interval: 5s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  notify_push:
    image: ghcr.io/nextcloud/notify_push:v1.4.1
    container_name: nextcloud_notify_push
    mem_limit: 128m
    labels:
      - 'wud.watch=true'
      - 'wud.display.name=Notify Push'
      - 'wud.display.icon=si:nextcloud'
      - 'wud.tag.include=^v\d+\.\d+\.\d+$$'
      - "wud.link.template=https://github.com/nextcloud/notify_push/releases/tag/v$${major}.$${minor}.$${patch}"
    environment:
      - PORT=7867
      - NEXTCLOUD_URL=http://nextcloud
    volumes:
      - nextcloud_html:/var/www/html:ro
    entrypoint: [ "/notify_push" ]
    command: [ "/var/www/html/config/config.php" ]
    networks:
      - nextcloud_internal
    depends_on:
      nextcloud:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres_db:
        condition: service_healthy
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    container_name: nextcloud_cloudflared
    profiles: [ "production" ]
    command: tunnel run
    mem_limit: 128m
    labels:
      - 'wud.watch=true'
      - 'wud.display.name=Cloudflared'
      - 'wud.display.icon=si:cloudflare'
      - 'wud.tag.include=^\d{4}\.\d+\.\d+$$'
      - "wud.link.template=https://github.com/cloudflare/cloudflared/releases/tag/$${major}.$${minor}.$${patch}"
    environment:
      - NO_AUTOUPDATE=true
    volumes:
      - ./cloudflared-config:/etc/cloudflared
    networks:
      - nextcloud_internal
    depends_on:
      nextcloud:
        condition: service_healthy
    restart: unless-stopped

volumes:
  nextcloud_html:
    driver: local

  postgres_data:
    driver: local

  redis_data:
    driver: local

  clamav_db:
    driver: local

  elasticsearch_data:
    driver: local

  scripts:
    driver: local
    driver_opts:
      type: "none"
      o: "bind"
      device: "./scripts"

  nextcloud_data:
    driver: local
    driver_opts:
      type: "${NEXTCLOUD_STORAGE_DRIVER_TYPE:-nfs}"
      o: "${NEXTCLOUD_STORAGE_DRIVER_OPTS:-addr=nas.srv.xbhl.intranet,rw,hard,intr,timeo=100}"
      device: "${NEXTCLOUD_STORAGE_DEVICE:-:/share/NFSv=4/RemoteStorage/NextCloud}"

networks:
  nextcloud_internal:
    name: nextcloud_internal_network
